<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor Test — FloGlo AI</title>
<style>
  body { background:#050914; color:#d7dee8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { max-width:600px; padding:48px 32px; text-align:center; }
  h1 { color:#fff; font-size:28px; margin:0 0 12px; }
  p { line-height:1.6; color:#9fb0c9; }
  .row { margin:30px 0; display:flex; gap:20px; justify-content:center; align-items:center; flex-wrap:wrap; }
  a { color:#3ee2ff; }
  button { background:#3ee2ff; color:#050914; border:0; padding:12px 30px; border-radius:999px; font-weight:700; font-size:15px; }
  input[type="text"] { background:#0a1226; border:1px solid #1c2a4a; color:#fff; padding:12px 16px; border-radius:10px; width:280px; font-size:15px; }
  input[type="text"]::placeholder { color:#5b6b8c; }
  .back { margin-top:36px; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Cursor test</h1>
  <p>Move your mouse. The logo is your cursor now — it should spin smooth and continuous, with zero ticking. Hover the link and button below (it grows), then the text field (it becomes a caret). Click anywhere for the ripple.</p>
  <div class="row">
    <a href="#">A link</a>
    <button type="button">A button</button>
  </div>
  <div class="row">
    <input type="text" placeholder="Text field — hover me">
  </div>
  <p class="back"><a href="/">Back to site</a></p>
</div>
<script src="cursor-new.js"></script>
</body>
</html>
